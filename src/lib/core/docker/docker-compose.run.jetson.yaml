# =================================================================================================
#
# Docker compose project run version for running on Jetson devices
#
# =================================================================================================

x-jetson-common: &jetson-common
  entrypoint: [] # Overide project-develop entrypoint as it will be started by up_and_attach.bash
  container_name: ${DN_CONTAINER_NAME:?err}
  environment:
    # (NICE TO HAVE) ToDo: add logic to auto set DN_HOST at runtime if its relevant (ref task NMO-669)
    # DN_HOST: 'l4t/arm64'
    DN_HOST: ${IMAGE_ARCH_AND_OS:?err}
    DN_ENTRYPOINT_TRACE_EXECUTION: ${DN_ENTRYPOINT_TRACE_EXECUTION:-false}
    DN_PROJECT_USER: ${DN_PROJECT_USER:?err}
    DN_CONTAINER_NAME: ${DN_CONTAINER_NAME:?err}
    DN_ACTIVATE_POWERLINE_PROMT: ${DN_ACTIVATE_POWERLINE_PROMT:-false}
    IS_TEAMCITY_RUN: ${IS_TEAMCITY_RUN:-false}
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-void}
    #     see https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/user-guide.html#environment-variables-oci-spec
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-}
    #     see https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/user-guide.html#driver-capabilities
    DISPLAY: ${DISPLAY:-":0"}
    QT_X11_NO_MITSHM: 1
    XAUTHORITY: /tmp/.docker.xauth
  env_file:
    - path: ${SUPER_PROJECT_ROOT:?err}/.dockerized_norlab/configuration/.env.dna
      required: true
    - path: ${DNA_ROOT:?err}/src/lib/core/docker/.env.dna-internal
      required: true
    - path: ${DNA_ROOT:?err}/src/lib/core/docker/.env.dna-internal.local
      required: false
    - path: ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/.env
      required: true
    - path: ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/.env.local
      required: false
  tty: true
  stdin_open: true
  devices:
    #- /dev/input/js0
    # ....From jetson-container run.sh....
    - /dev/snd
    - /dev/bus/usb
  privileged: false
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
  cap_add:
    - SYS_PTRACE
    - SYS_NICE
  ulimits: # Real-Time related: See https://github.com/2b-t/docker-realtime?tab=readme-ov-file
    rtprio: 99
    rttime: -1 # corresponds to 'unlimited'
    memlock: 8428281856
  network_mode: host    # allow the container to have full access to the host’s networking system
  pid: host
  ipc: host   # see comment  https://stable-baselines3.readthedocs.io/en/master/guide/install.html#run-the-images-cpu-gpu
  init: true  # Propagate exit code (See remark in task NMO-266)
  runtime: ${DN_DOCKER_RUNTIME:-runc}

services:

  project-develop:
    extends:
      service: project-develop
      file: docker-compose.run.main.yaml
    <<: *jetson-common
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw # Share system folder
      # ....Dockerized-NorLab-project internal. ...................................................
      - ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/entrypoints/:/entrypoints/:ro
      - ${SUPER_PROJECT_ROOT}/.dockerized_norlab/dn_container_env_variable/:/dn_container_env_variable/:rw
      # ....Add host volume you want to mount into the container...................................
      - ${SUPER_PROJECT_ROOT}/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/:rw
      - ${SUPER_PROJECT_ROOT}/artifact/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/artifact/:rw
      - ${SUPER_PROJECT_ROOT}/data/external_data/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/external_data/:rw
      - ${SUPER_PROJECT_ROOT}/data/repository_data/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/repository_data/:rw
      - ${DNA_HOST_SHARED_DATA_PATH:-${SUPER_PROJECT_ROOT}/data/shared_data/}:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/shared_data/:ro
      # ....From jetson-container run.sh....
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /tmp/nv_jetson_model:/tmp/nv_jetson_model

  project-deploy:
    extends:
      service: project-deploy
      file: docker-compose.run.main.yaml
    <<: *jetson-common
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw # Share system folder
      # ....Add host volume you want to mount into the container...................................
      - ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/entrypoints/:/entrypoints/:ro
      # ....Add host volume you want to mount into the container...................................
      - ${SUPER_PROJECT_ROOT}/artifact/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/artifact/:rw
      - ${SUPER_PROJECT_ROOT}/data/external_data/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/external_data/:rw
      - ${DNA_HOST_SHARED_DATA_PATH:-${SUPER_PROJECT_ROOT}/data/shared_data/}:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/shared_data/:ro
      # ....From jetson-container run.sh....
      - /tmp/argus_socket:/tmp/argus_socket
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /tmp/nv_jetson_model:/tmp/nv_jetson_model

  project-ci-tests:
    extends:
      service: project-ci-tests
      file: docker-compose.run.main.yaml

  project-slurm:
    extends:
      service: project-slurm
      file: docker-compose.run.main.yaml
