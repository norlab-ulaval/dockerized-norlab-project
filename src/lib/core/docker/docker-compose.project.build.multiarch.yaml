# @formatter:off

services:

  project-core-pre:
    extends:
      service: project-core-pre
      file: docker-compose.project.build.native.yaml
    build:
      platforms:
        - "linux/amd64"
        - "linux/arm64"

  project-core-user:
    extends:
      service: project-core-user
      file: docker-compose.project.build.native.yaml
    build:
      platforms:
        - "linux/amd64"
        - "linux/arm64"

  project-core:
    extends:
      service: project-core
      file: docker-compose.project.build.native.yaml
    build:
      platforms:
        - "linux/amd64"
        - "linux/arm64"

  project-develop:
    extends:
      service: project-develop
      file: docker-compose.project.build.native.yaml
    build:
      pull: true # Use the dockerhub registry
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    depends_on:
      - project-core

  project-deploy:
    extends:
      service: project-deploy
      file: docker-compose.project.build.native.yaml
    build:
      pull: true # Use the dockerhub registry
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    depends_on:
      - project-core

#  project-release:
#    extends:
#      service: project-deploy
#      file: docker-compose.project.build.native.yaml
#    build:
#      pull: true # Use the dockerhub registry
#      platforms:
#        - "linux/arm64"
#        - "linux/amd64"
#    depends_on:
#      - project-core

  project-ci-tests:
    extends:
      service: project-ci-tests
      file: docker-compose.project.build.native.yaml
    build:
      dockerfile: ${DNA_ROOT:?err}/src/lib/core/docker/Dockerfile.ci-tests.multiarch
      pull: true # Use the dockerhub registry
      platforms:
        - "linux/arm64"
        - "linux/amd64"
    depends_on:
      - project-core

  project-slurm:
    extends:
      service: project-slurm
      file: docker-compose.project.build.native.yaml
    build:
      pull: true # Use the dockerhub registry
      platforms:
        - "linux/arm64"
        - "linux/amd64"
    depends_on:
      - project-core
