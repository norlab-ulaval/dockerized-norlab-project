
services:

  project-develop:
    extends:
      service: project-develop
      file: docker-compose.run.main.yaml

  project-deploy:
    extends:
      service: project-deploy
      file: docker-compose.run.main.yaml

  project-ci-tests:
    extends:
      service: project-ci-tests
      file: docker-compose.run.main.yaml

  project-slurm:
    extends:
      service: project-slurm
      file: docker-compose.run.main.yaml
    environment:
      # (☕minor) ToDo: validate deleting env var IS_SLURM_RUN -> its not used
      IS_SLURM_RUN: ${IS_SLURM_RUN:-false}
      # (NICE TO HAVE) ToDo: add logic to auto set DN_HOST at runtime if its relevant (ref task NMO-669)
      DN_HOST: 'linux/x86'
      # DN_HOST: ${IMAGE_ARCH_AND_OS:?err}
      DN_PROJECT_USER: ${DN_PROJECT_USER:?err}
      DN_CONTAINER_NAME: ${DN_CONTAINER_NAME:?err}-slurm${DNA_SJOB_NAME}
      DN_ENTRYPOINT_TRACE_EXECUTION: ${DN_ENTRYPOINT_TRACE_EXECUTION:-false}
      DN_ACTIVATE_POWERLINE_PROMT: false
      IS_TEAMCITY_RUN: ${IS_TEAMCITY_RUN:-false}
      # Use CUDA_VISIBLE_DEVICES instead of NVIDIA_VISIBLE_DEVICES and NVIDIA_DRIVER_CAPABILITIES
      #  as the slurm server automatically assigned gpu id per job
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES}
      DISPLAY: ${DISPLAY:-":0"}
      QT_X11_NO_MITSHM: 1
      XAUTHORITY: /tmp/.docker.xauth
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw # Share system folder
      # ....Dockerized-NorLab-project internal. ...................................................
      - ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/entrypoints/:/entrypoints/:ro
      - ${SUPER_PROJECT_ROOT}/.dockerized_norlab/dn_container_env_variable/:/dn_container_env_variable/:rw
      # ....Add host volume you want to mount into the container...................................
      - ${SUPER_PROJECT_ROOT}/artifact/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/artifact/:rw
      - ${SUPER_PROJECT_ROOT}/data/external_data/:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/external_data/:rw
      - ${DNA_HOST_SHARED_DATA_PATH:-${SUPER_PROJECT_ROOT}/data/shared_data/}:/ros2_ws/src/${DN_PROJECT_GIT_NAME}/data/shared_data/:ro
    env_file:
      - path: ${SUPER_PROJECT_ROOT:?err}/.dockerized_norlab/configuration/.env.dna
        required: true
      - path: ${DNA_ROOT:?err}/src/lib/core/docker/.env.dna-internal
        required: true
      - path: ${DNA_ROOT:?err}/src/lib/core/docker/.env.dna-internal.local
        required: false
      - path: ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/.env
        required: true
      - path: ${SUPER_PROJECT_ROOT}/.dockerized_norlab/configuration/.env.local
        required: false
    tty: false
    stdin_open: false
    # privileged: false
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_PTRACE
      - SYS_NICE
    network_mode: host    # allow the container to have full access to the host’s networking system
    pid: host
    ipc: host   # see comment  https://stable-baselines3.readthedocs.io/en/master/guide/install.html#run-the-images-cpu-gpu
    init: true  # Propagate exit code (See remark in task NMO-266)
    # Note: runtime is only used for Docker-based slurm (e.g. Mamba server).
    # Apptainer-based HPC servers (Valeria, Compute Canada) use standalone exec scripts
    # and never go through docker-compose — see 'dna run slurm --generate-apptainer'.
    runtime: ${DN_DOCKER_RUNTIME:-runc}
